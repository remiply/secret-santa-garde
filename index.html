<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa – Garde du 25</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;
    background:radial-gradient(circle at 50% 0%,#b3121b 0%,#6d0a10 55%,#2a0306 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
  .snow{position:fixed;inset:0;pointer-events:none}
  .flake{position:absolute;top:-10px;color:#fff;opacity:.8;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh)}}
  .card{position:relative;width:100%;max-width:380px;text-align:center;z-index:2}
  .badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:99px;margin-bottom:18px}
  h1{font-family:'Mountains of Christmas',cursive;font-size:46px;line-height:1;margin-bottom:8px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .hello{font-size:18px;opacity:.9;margin-bottom:28px}
  .hello b{font-weight:800}
  .gift{width:200px;height:200px;margin:0 auto 24px;cursor:pointer;transition:transform .2s}
  .gift:active{transform:scale(.95)}
  .gift.shake{animation:shake .6s}
  @keyframes shake{20%,60%{transform:rotate(-6deg)}40%,80%{transform:rotate(6deg)}}
  .hint{font-size:15px;opacity:.85}
  .reveal{display:none}
  .reveal .lbl{font-size:16px;opacity:.85;margin-bottom:10px}
  .name{font-size:52px;font-weight:800;color:#ffd84d;letter-spacing:.02em;margin-bottom:22px;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
  .rules{background:rgba(0,0,0,.25);border-radius:16px;padding:16px;font-size:14px;line-height:1.5;text-align:left}
  .rules li{margin-left:18px}
  .shh{margin-top:16px;font-size:13px;opacity:.7}
  .err{font-size:16px;opacity:.9;line-height:1.5}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="card" id="app"></div>
<script>
const K="NOEL25";
function dec(h){try{let s="";for(let i=0;i<h.length;i+=2){s+=String.fromCharCode(parseInt(h.substr(i,2),16)^K.charCodeAt((i/2)%K.length));}return decodeURIComponent(escape(s));}catch(e){return null}}
const app=document.getElementById('app');
const raw=(location.hash||"").replace("#","");
const data=raw.startsWith("s")?dec(raw.slice(1)):null;
const parts=data&&data.includes("|")?data.split("|"):null;
const giftSVG=`<svg viewBox="0 0 200 200"><rect x="30" y="80" width="140" height="105" rx="8" fill="#1f8a4c"/><rect x="20" y="58" width="160" height="34" rx="8" fill="#24a35a"/><rect x="88" y="58" width="24" height="127" fill="#ffd84d"/><path d="M100 58 C70 20,40 40,62 58Z M100 58 C130 20,160 40,138 58Z" fill="#ffd84d"/><circle cx="100" cy="58" r="9" fill="#f2b705"/></svg>`;
if(!parts){
  app.innerHTML=`<div class="badge">Garde du 25 décembre</div><h1>Secret Santa</h1><p class="err">Ouvre le lien perso qu'on t'a envoyé pour découvrir à qui tu fais ton cadeau 🎅</p>`;
}else{
  const [me,target]=parts;
  app.innerHTML=`<div class="badge">Garde du 25 décembre · Asnières</div>
  <h1>Secret Santa</h1>
  <p class="hello">Salut <b>${me}</b> !</p>
  <div id="closed"><div class="gift" id="gift">${giftSVG}</div><p class="hint">Touche le cadeau pour découvrir ton binôme</p></div>
  <div class="reveal" id="open">
    <p class="lbl">Tu offres un cadeau à</p>
    <div class="name">${target}</div>
    <div class="rules"><ul>
      <li>Garde le secret jusqu'à l'ouverture.</li>
      <li>Cadeau à apporter le 25 au matin.</li>
      <li>Ouverture des cadeaux au café, après le repas des régions.</li>
    </ul></div>
    <p class="shh">🤫 Ne montre pas ton écran.</p>
  </div>`;
  const g=document.getElementById('gift');
  g.addEventListener('click',()=>{g.classList.add('shake');setTimeout(()=>{document.getElementById('closed').style.display='none';document.getElementById('open').style.display='block';},650);});
}
const snow=document.getElementById('snow');
for(let i=0;i<40;i++){const f=document.createElement('div');f.className='flake';f.textContent='❄';
  f.style.left=Math.random()*100+'vw';f.style.fontSize=(8+Math.random()*14)+'px';
  f.style.animationDuration=(6+Math.random()*8)+'s';f.style.animationDelay=(-Math.random()*14)+'s';snow.appendChild(f);}
</script>
</body>
</html>
